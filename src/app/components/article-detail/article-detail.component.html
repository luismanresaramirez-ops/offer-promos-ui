<div *ngIf="article">
  <h2>Détails de l'article</h2>
  <p><strong>ID :</strong> {{ article.id }}</p>
  <p><strong>Désignation :</strong> {{ article.designation }}</p>
  <p><strong>Prix :</strong> {{ article.price }}</p>

  <div *ngIf="article.mineurs && article.mineurs.length > 0">
    <h3>Articles mineurs associés</h3>
    <ul>
      <li *ngFor="let m of article.mineurs">
        {{ m.designation }} (Option : {{ m.prixEnOption }})
      </li>
    </ul>
  </div>
</div>

<p *ngIf="!article">Aucun article trouvé.</p>
